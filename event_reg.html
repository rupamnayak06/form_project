<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration — Independence Day</title>
<style>
  :root{
    --saffron:#FF9933;
    --white:#FFFFFF;
    --green:#138808;
    --navy:#0B1F3A;
    --ink:#1A1A1A;
    --paper:#FFFDF8;
    --line:#E4DECF;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    font-family:'Georgia','Times New Roman',serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:40px 16px 80px;
  }

 

  .card{
    width:100%;
    max-width:620px;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:4px;
    box-shadow:0 20px 50px rgba(11,31,58,0.08);
    overflow:hidden;
    margin-top:10px;
  }

  .header{
    background:var(--navy);
    color:var(--white);
    padding:44px 40px 32px;
    text-align:center;
    position:relative;
  }


  .eyebrow{
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:11px;
    color:var(--saffron);
    font-family:Arial, sans-serif;
    margin-bottom:10px;
  }

  h1{
    margin:0;
    font-size:34px;
    font-weight:400;
    letter-spacing:0.5px;
  }

  .header p{
    font-family:Arial, sans-serif;
    font-size:13px;
    color:#C9D2E0;
    margin:10px 0 0;
    letter-spacing:0.5px;
  }

  form{
    padding:36px 40px 44px;
  }

  .field{
    margin-bottom:22px;
  }

  label{
    display:block;
    font-family:Arial, sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--navy);
    margin-bottom:8px;
    font-weight:bold;
  }

  input[type="text"],
  input[type="tel"],
  input[type="email"],
  select{
    width:100%;
    padding:12px 14px;
    font-size:15px;
    font-family:'Georgia', serif;
    border:1px solid #CBC3AC;
    border-radius:3px;
    background:var(--paper);
    color:var(--ink);
    transition:border-color 0.2s, box-shadow 0.2s;
  }

  input:focus, select:focus{
    outline:none;
    border-color:var(--saffron);
    box-shadow:0 0 0 3px rgba(255,153,51,0.18);
  }

  fieldset{
    border:1px solid var(--line);
    border-radius:3px;
    padding:14px 16px 16px;
    margin:0;
  }

  legend{
    font-family:Arial, sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--navy);
    font-weight:bold;
    padding:0 6px;
  }

  .radio-row{
    display:flex;
    gap:24px;
    margin-top:4px;
  }

  .radio-option{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:Arial, sans-serif;
    font-size:14px;
  }

  .radio-option input[type="radio"]{
    accent-color:var(--green);
    width:16px;
    height:16px;
    cursor:pointer;
  }

  .radio-option label{
    margin:0;
    text-transform:none;
    letter-spacing:0;
    font-weight:normal;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }

  .events-list{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:4px;
  }

  .event-option{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:Arial, sans-serif;
    font-size:14px;
  }

  .event-option input[type="checkbox"]{
    accent-color:var(--green);
    width:17px;
    height:17px;
    cursor:pointer;
    flex-shrink:0;
  }

  .event-option label{
    margin:0;
    text-transform:none;
    letter-spacing:0;
    font-weight:normal;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }

  .submit-btn{
    width:100%;
    margin-top:12px;
    padding:15px;
    font-family:Arial, sans-serif;
    font-size:14px;
    font-weight:bold;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--white);
    background:linear-gradient(90deg, var(--saffron), #E8862F);
    border:none;
    border-radius:3px;
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .submit-btn:hover{
    box-shadow:0 8px 20px rgba(255,153,51,0.35);
    transform:translateY(-1px);
  }

  .submit-btn:focus-visible{
    outline:3px solid var(--navy);
    outline-offset:2px;
  }

  .submit-btn:active{
    transform:translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    .submit-btn{ transition:none; }
  }

  @media (max-width:480px){
    .header{ padding:36px 24px 26px; }
    form{ padding:28px 22px 34px; }
    h1{ font-size:26px; }
    .radio-row{ gap:16px; flex-wrap:wrap; }
  }
</style>
</head>
<body>


  <div class="card">
    <div class="header">
      <div class="eyebrow">Intra College Event</div>
      <h1>Student Registration</h1>
    </div>

    <form action="#" method="POST">

      <div class="field">
        <label for="name">Student Name</label>
        <input type="text" id="name" name="student_name" placeholder="Enter your full name" required>
      </div>

      <div class="field">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile_number" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="course">Course</label>
        <input type="text" id="course" name="course" placeholder="e.g. B.Tech CSE" required>
      </div>

      <div class="field">
        <label for="section">Section</label>
        <input type="text" id="section" name="section" placeholder="e.g. A" required>
      </div>

      <div class="field">
        <fieldset>
          <legend>Registering for</legend>
          <div class="events-list">
            <div class="event-option">
              <input type="checkbox" id="event-flag" name="events" value="flag_hoisting">
              <label for="event-flag">Independence Day celebration</label>
            </div>
            <div class="event-option">
              <input type="checkbox" id="event-parade" name="events" value="march_past">
              <label for="event-parade">March Past / Parade</label>
            </div>
            <div class="event-option">
              <input type="checkbox" id="event-cultural" name="events" value="cultural_program">
              <label for="event-cultural">Cultural Program</label>
            </div>
            <div class="event-option">
              <input type="checkbox" id="event-speech" name="events" value="speech_competition">
              <label for="event-speech">Speech Competition</label>
            </div>
            <div class="event-option">
              <input type="checkbox" id="event-quiz" name="events" value="quiz">
              <label for="event-quiz">Quiz Competition</label>
            </div>
            <div class="event-option">
              <input type="checkbox" id="event-art" name="events" value="painting_poster">
              <label for="event-art">Painting / Poster Making</label>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="field">
        <fieldset>
          <legend>Will you attend the post-event programmes ?</legend>
          <div class="radio-row">
            <div class="radio-option">
              <input type="radio" id="attend-yes" name="attending" value="yes" required>
              <label for="attend-yes">Yes</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="attend-no" name="attending" value="no">
              <label for="attend-no">No</label>
            </div>
          </div>
        </fieldset>
      </div>

      <div class="field">
        <fieldset>
          <legend>Participating in the post-event programmes ?</legend>
          <div class="radio-row">
            <div class="radio-option">
              <input type="radio" id="present-yes" name="presentation" value="yes" required>
              <label for="present-yes">Yes</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="present-no" name="presentation" value="no">
              <label for="present-no">No</label>
            </div>
          </div>
        </fieldset>
      </div>

      <button type="submit" class="submit-btn">Submit Registration</button>

    </form>
  </div>

</body>
</html>
